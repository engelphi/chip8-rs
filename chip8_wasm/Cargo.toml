[package]
name = "chip8_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chip8_core = { path = "../chip8_core" }
js-sys = "0.3.98"
wasm-bindgen = "0.2.121"

[dependencies.web-sys]
version = "0.3.98"
features = [
	"CanvasRenderingContext2d",
	"Document",
	"Element",
	"HtmlCanvasElement",
	"ImageData",
	"KeyboardEvent",
	"Window"
]
